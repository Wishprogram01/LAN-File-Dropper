[package]
name = "lan-drop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Encrypted P2P LAN file transfer CLI with UDP auto-discovery"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
hex = "0.4"
indicatif = "0.17"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
